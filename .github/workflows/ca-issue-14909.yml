name: CA Issue 14909 verification

on:
  push:
    branches: [main, "codex/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Python ${{ matrix.python }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - name: Install project and CI tools
        run: python -m pip install --upgrade pip ruff pip-audit && python -m pip install -e .
      - name: Lint
        run: ruff check src/_pytest/monkeypatch.py testing/test_monkeypatch.py
      - name: Regression tests
        run: python -m pytest testing/test_monkeypatch.py -q
      - name: Dependency vulnerability scan
        run: pip-audit
  container:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Build verification container
        run: docker build --tag pytest-issue-14909:${{ github.sha }} .
      - name: Run regression tests in container
        run: docker run --rm pytest-issue-14909:${{ github.sha }}
